
name: Compile and Deploy to Sepolia

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Compile and Deploy
    runs-on: ubuntu-latest
    environment: Testnet

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate solc standard-JSON input
        run: node scripts/build-input.cjs

      - name: Compile contracts in Docker
        run: |
          docker run --rm -i \
            -v "$PWD":/app \
            -w /app \
            ethereum/solc:0.8.24 \
            --standard-json --base-path /app --include-path /app/node_modules \
            < build/input.json > build/output.json

      - name: Check compiler errors
        run: |
          jq -e '[.errors[]? | select(.severity == "error")] | length == 0' build/output.json \
            || { echo "::error::Solidity compilation failed"; jq '.errors' build/output.json; exit 1; }

      - name: Verify deployment secrets
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          SEPOLIA_PRIVATE_KEY: ${{ secrets.SEPOLIA_PRIVATE_KEY }}
        run: |
          if [ -z "$SEPOLIA_RPC_URL" ]; then
            echo "::error::SEPOLIA_RPC_URL is missing"
            exit 1
          fi

          if [ -z "$SEPOLIA_PRIVATE_KEY" ]; then
            echo "::error::SEPOLIA_PRIVATE_KEY is missing"
            exit 1
          fi

          echo "Both deployment secrets are available."

      - name: Deploy to Sepolia
        run: node scripts/deploy.js
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          SEPOLIA_PRIVATE_KEY: ${{ secrets.SEPOLIA_PRIVATE_KEY }}
